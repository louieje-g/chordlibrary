<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord Library</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <span>Chord Library</span>
      </div>
      <button class="icon-btn theme-toggle" id="themeToggle" title="Toggle theme">
        <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-section">
      <div class="sidebar-section-header">
        <span>Playlists</span>
        <button class="icon-btn" id="addPlaylistBtn" title="New playlist">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
      <ul class="playlist-list" id="playlistList"></ul>
    </div>

    <div class="sidebar-footer">
      <div class="all-songs-btn" id="allSongsBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        All Songs
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="main" id="main">
    <!-- Top bar -->
    <header class="topbar">
      <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="topbar-title" id="topbarTitle">All Songs</div>
      <div class="topbar-actions">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search songs…" />
        </div>
        <button class="btn btn-primary" id="addSongBtn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Add Song
        </button>
      </div>
    </header>

    <!-- Song list view -->
    <div class="content" id="songListView">
      <div class="song-grid" id="songGrid"></div>
      <div class="empty-state" id="emptyState" style="display:none">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
        </svg>
        <h3>No songs yet</h3>
        <p>Click <strong>Add Song</strong> to get started.</p>
      </div>
    </div>

    <!-- Song detail view -->
    <div class="content hidden" id="songDetailView">
      <div class="detail-header">
        <button class="icon-btn back-btn" id="backBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="detail-title-wrap">
          <h1 class="detail-title" id="detailTitle"></h1>
          <span class="detail-artist" id="detailArtist"></span>
        </div>
        <div class="detail-actions">
          <button class="btn btn-sm" id="editSongBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            Edit
          </button>
          <button class="btn btn-sm btn-danger" id="deleteSongBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
            </svg>
            Delete
          </button>
        </div>
      </div>

      <div class="transpose-bar">
        <span class="transpose-label">Transpose</span>
        <button class="transpose-btn" id="transposeDown" title="Half step down">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <span class="transpose-value" id="transposeValue">0</span>
        <button class="transpose-btn" id="transposeUp" title="Half step up">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="btn btn-sm" id="resetTranspose">Reset</button>
        <div class="add-to-playlist-wrap" id="addToPlaylistWrap">
          <button class="btn btn-sm" id="addToPlaylistBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            Add to Playlist
          </button>
        </div>
      </div>

      <div class="chord-display" id="chordDisplay"></div>
    </div>
  </main>

  <!-- Modal: Song Form -->
  <div class="modal-overlay" id="songModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="songModalTitle">Add Song</h2>
        <button class="icon-btn" id="closeSongModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="songTitle">Song Title <span class="required">*</span></label>
          <input type="text" id="songTitle" placeholder="e.g. Wonderwall" />
        </div>
        <div class="form-group">
          <label for="songArtist">Artist</label>
          <input type="text" id="songArtist" placeholder="e.g. Oasis" />
        </div>
        <div class="form-group">
          <label for="songKey">Key</label>
          <input type="text" id="songKey" placeholder="e.g. C" />
        </div>
        <div class="form-group">
          <label for="songChords">
            Chords / Lyrics
            <span class="hint">Wrap chords in brackets: [C] [G] [Am] [F]</span>
          </label>
          <textarea id="songChords" rows="12" placeholder="[C]Amazing [G]grace how [Am]sweet the [F]sound&#10;[C]That saved a [G]wretch like [C]me"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="cancelSongModal">Cancel</button>
        <button class="btn btn-primary" id="saveSongBtn">Save Song</button>
      </div>
    </div>
  </div>

  <!-- Modal: Playlist Form -->
  <div class="modal-overlay" id="playlistModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2 id="playlistModalTitle">New Playlist</h2>
        <button class="icon-btn" id="closePlaylistModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="playlistName">Playlist Name <span class="required">*</span></label>
          <input type="text" id="playlistName" placeholder="e.g. Sunday Worship" />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="cancelPlaylistModal">Cancel</button>
        <button class="btn btn-primary" id="savePlaylistBtn">Save</button>
      </div>
    </div>
  </div>

  <!-- Modal: Add to Playlist -->
  <div class="modal-overlay" id="addToPlaylistModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Add to Playlist</h2>
        <button class="icon-btn" id="closeAddToPlaylistModal">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div id="playlistPickerList" class="playlist-picker-list"></div>
        <p class="no-playlists-msg" id="noPlaylistsMsg" style="display:none">No playlists yet. Create one first.</p>
      </div>
      <div class="modal-footer">
        <button class="btn" id="cancelAddToPlaylistModal">Close</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
